<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>인스타 아이디 생성기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F9F7F4;
      --surface: #FFFFFF;
      --border: #E5E0D8;
      --text: #1C1917;
      --sub: #78716C;
      --muted: #A8A29E;
      --accent: #C4A882;
      --accent-d: #9B7E5A;
      --green: #4C9E72;
      --radius: 6px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans KR', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2.5rem 1rem 4rem;
      font-size: 14px;
    }
    .wrap { max-width: 700px; margin: 0 auto; }

    /* Header */
    .header { margin-bottom: 2rem; }
    .header h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -.02em; }
    .header p  { font-size: .8rem; color: var(--sub); margin-top: .3rem; line-height: 1.5; }

    /* Rules badge */
    .rules {
      display: flex; flex-wrap: wrap; gap: .4rem;
      margin-bottom: 1.5rem;
    }
    .rule-badge {
      font-size: .7rem; padding: 3px 9px;
      border-radius: 99px;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--sub);
    }
    .rule-badge.ok  { border-color: #BBD9C8; color: #2E7D52; background: #F0FAF4; }
    .rule-badge.no  { border-color: #F0BBBB; color: #9B2B2B; background: #FFF0F0; }

    /* Controls */
    .controls {
      display: flex; align-items: center; gap: .6rem;
      flex-wrap: wrap; margin-bottom: 1rem;
    }
    .controls label { font-size: .8rem; color: var(--sub); white-space: nowrap; }
    input[type=number] {
      width: 72px; padding: 7px 10px;
      border: 1.5px solid var(--border); border-radius: var(--radius);
      font-size: .85rem; font-family: inherit;
      background: var(--surface); color: var(--text);
    }
    input[type=number]:focus { outline: none; border-color: var(--accent); }
    button {
      padding: 7px 16px;
      border: 1.5px solid var(--border);
      background: var(--surface); color: var(--text);
      border-radius: var(--radius);
      font-size: .8rem; font-family: inherit;
      cursor: pointer; transition: .12s ease;
      white-space: nowrap;
    }
    button:hover { border-color: var(--accent); color: var(--accent-d); }
    button.primary {
      background: var(--accent-d); border-color: var(--accent-d);
      color: #fff; font-weight: 500;
    }
    button.primary:hover { background: #7C6347; border-color: #7C6347; }
    button.danger { color: var(--muted); border-color: var(--border); }
    button.danger:hover { color: #9B2B2B; border-color: #F0BBBB; background: #FFF0F0; }

    /* Stats bar */
    .stats-bar {
      display: flex; justify-content: space-between; align-items: center;
      font-size: .75rem; color: var(--muted);
      padding: .5rem 0; margin-bottom: .5rem;
    }

    /* Output */
    #output {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .empty {
      padding: 3rem; text-align: center;
      color: var(--muted); font-size: .85rem;
    }

    /* List rows */
    .id-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      gap: .75rem;
      padding: .55rem 1rem;
      border-bottom: 1px solid #F3EFE8;
      transition: background .08s;
    }
    .id-row:last-child { border-bottom: none; }
    .id-row:hover { background: #FDFBF8; }

    .id-val {
      font-family: 'Courier New', Courier, monospace;
      font-size: .92rem;
      letter-spacing: .025em;
      color: var(--text);
      word-break: break-all;
    }

    .id-name {
      font-size: .75rem; color: var(--sub);
      white-space: nowrap;
    }

    .copy-btn {
      font-size: .68rem; padding: 2px 8px;
      color: var(--muted); border-color: var(--border);
    }
    .copy-btn:hover { color: var(--green); border-color: var(--green); background: #F0FAF4; }
    .copy-btn.done { color: var(--green); border-color: var(--green); background: #F0FAF4; }

    /* Footer note */
    .footnote { font-size: .7rem; color: var(--muted); margin-top: 1rem; line-height: 1.6; }
  </style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <h1>인스타 아이디 생성기</h1>
    <p>한국인 감성 · 패턴 분해로 중복 최소화 · 이름 기반</p>
  </div>

  <div class="rules">
    <span class="rule-badge ok">_ 앞뒤 사용 가능</span>
    <span class="rule-badge ok">__ 이중 언더스코어 가능</span>
    <span class="rule-badge ok">. 중간 사용 가능</span>
    <span class="rule-badge no">. 맨 앞/뒤 불가</span>
    <span class="rule-badge no">.. 연속 점 불가</span>
    <span class="rule-badge no">30자 초과 불가</span>
  </div>

  <div class="controls">
    <label>생성 개수</label>
    <input type="number" id="count" value="30" min="1" max="500">
    <button class="primary" onclick="generateBatch()">생성하기</button>
    <button onclick="copyAll(this)">전체 복사</button>
    <button onclick="exportCSV()">CSV 저장</button>
    <button class="danger" onclick="clearHistory()">기록 초기화</button>
  </div>

  <div class="stats-bar">
    <span id="result-info">아직 생성된 아이디가 없습니다</span>
    <span id="history-info"></span>
  </div>

  <div id="output">
    <div class="empty">위에서 생성 개수를 입력하고 <strong>생성하기</strong>를 눌러주세요.</div>
  </div>

  <p class="footnote">
    * LocalStorage에 생성 이력을 저장합니다. 같은 브라우저에서는 중복이 발생하지 않습니다.<br>
    * 이름은 참고용이며 실제 해당 아이디 소유 여부는 인스타그램에서 직접 확인하세요.
  </p>

</div>

// ════════════════════════════════════════════════════
// 두벌식 → QWERTY
// ════════════════════════════════════════════════════

const CHO  = ["r","R","s","e","E","f","a","q","Q","t","T","d","w","W","c","z","x","v","g"];
const JUNG = ["k","o","i","O","j","p","u","P","h","hk","ho","hl","y","n","nj","np","nl","b","m","ml","l"];
const JONG  = ["","r","R","rt","s","sw","sg","e","f","fr","fa","fq","ft","fx","fv","fg","a","q","qt","t","T","d","w","c","z","x","v","g"];

function hangulToQwerty(str) {
  let out = "";
  for (const ch of str) {
    const cp = ch.codePointAt(0);
    if (cp >= 0xAC00 && cp <= 0xD7A3) {
      const idx = cp - 0xAC00;
      out += CHO[Math.floor(idx / 28 / 21)] + JUNG[Math.floor(idx / 28) % 21] + JONG[idx % 28];
    } else { out += ch; }
  }
  return out.toLowerCase();
}

// ════════════════════════════════════════════════════
// 유틸리티
// ════════════════════════════════════════════════════

function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function randInt(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
function prob(p) { return Math.random() < p; }

// 문자열을 n개 조각으로 분절
function splitToParts(str, n) {
  n = Math.min(n, str.length);
  if (n <= 1) return [str];
  const positions = new Set();
  let tries = 0;
  while (positions.size < n - 1 && tries < 40) {
    positions.add(randInt(1, str.length - 1));
    tries++;
  }
  const cuts = [...positions].sort((a, b) => a - b);
  const parts = [];
  let prev = 0;
  for (const c of cuts) { if (c > prev) parts.push(str.slice(prev, c)); prev = c; }
  parts.push(str.slice(prev));
  return parts.filter(p => p.length > 0);
}

// 배열을 랜덤 세퍼레이터로 연결
function joinParts(parts, pool) {
  let r = "";
  for (let i = 0; i < parts.length; i++) {
    r += parts[i];
    if (i < parts.length - 1) r += rand(pool);
  }
  return r;
}

// 숫자 문자열 분절 — 최대 1회 (e.g. 98→9.8, 9804→98.04)
function fragNum(numStr) {
  if (numStr.length <= 1 || prob(0.45)) return numStr;
  const sep = rand([".", "_"]);
  const at = randInt(1, numStr.length - 1);
  return numStr.slice(0, at) + sep + numStr.slice(at);
}

// 생년 숫자 생성 (2자리, 4자리, 6자리 혼합)
function birthNum() {
  const yrs  = ["94","95","96","97","98","99","00","01","02","03","04","05","93","92","91"];
  const mths = ["01","02","03","04","05","06","07","08","09","10","11","12"];
  const days  = ["01","04","07","09","11","14","17","18","21","22","25","28"];
  const yr = rand(yrs);
  const roll = Math.random();
  if (roll < 0.30) return yr;
  if (roll < 0.65) return yr + rand(mths);
  return yr + rand(mths) + rand(days);
}

// 선택적 leet 치환 (최대 1곳, 25% 확률)
function leet(str) {
  if (prob(0.75)) return str;
  const map = [["l","1"],["o","0"],["i","1"],["e","3"],["a","4"]];
  const [f, t] = rand(map);
  return str.replace(f, t); // 첫 번째 등장만
}

// ════════════════════════════════════════════════════
// 인스타그램 ID 검증 (공식 규칙 기반)
// ════════════════════════════════════════════════════

function isValidId(id) {
  const sepCount = (id.match(/[._]/g) || []).length;
  return (
    id.length >= 4 &&
    id.length <= 20 &&                    // 너무 긴 ID 방지
    /^[a-z0-9._]+$/.test(id) &&
    !/\.\./.test(id) &&                   // 연속 점 불가
    !/^\./.test(id) &&                    // 점으로 시작 불가
    !/\.$/.test(id) &&                    // 점으로 끝 불가
    sepCount <= 3                         // 세퍼레이터 최대 3개
    // 언더스코어는 앞/뒤/연속 모두 허용
  );
}

function cleanId(id) {
  return id
    .toLowerCase()
    .replace(/[^a-z0-9._]/g, "")   // 허용 문자 외 제거
    .replace(/\.{2,}/g, ".")        // 연속 점 → 단일 점
    .replace(/_{3,}/g, "__")        // 3중+ 언더스코어 → 이중
    .replace(/^\.+/, "")            // 앞쪽 점 제거
    .replace(/\.+$/, "")            // 뒤쪽 점 제거
    .slice(0, 30);
}

// 전략 1: 이름 미세 분해 (핵심 전략)
// e.un_ji9.8  seo_yeon98  park.min98
function stratFragmented(fam, given) {
  const num = fragNum(birthNum());
  // 짧은 이름 문자열 우선 (길이 제한)
  const namePool = [
    given.r,
    given.s[0] + given.s[given.s.length - 1],
    fam.r + given.s[0],
    fam.r.slice(0, 3) + given.r,
  ];
  const nameStr = rand(namePool);
  // 최대 3조각으로 분절
  const nParts = randInt(2, Math.min(3, nameStr.length));
  const parts = splitToParts(nameStr, nParts);
  // 숫자를 랜덤 위치에 삽입
  const insertAt = randInt(0, parts.length);
  parts.splice(insertAt, 0, num);
  // 각기 다른 세퍼레이터로 연결
  let result = "";
  for (let i = 0; i < parts.length; i++) {
    result += parts[i];
    if (i < parts.length - 1) result += rand(SEPS_GENERAL);
  }
  return { id: cleanId(leet(result)), label: fam.h + " " + given.h };
}

// 전략 2: 두벌식 → QWERTY 키보드 전환
// 김은지 → rlasdw  박지수 → qkrwltn
function stratKeyboard(fam, given) {
  const hangul = fam.h + given.h;
  let qwerty = hangulToQwerty(hangul);
  // 선택적 suffix
  const sfx = rand(["","_","97","_98",".02","__","_log","._","01","03"]);
  qwerty += sfx;
  // 선택적 이름 분절
  if (prob(0.5)) qwerty = joinParts(splitToParts(qwerty, 2), SEPS_SIMPLE);
  return { id: cleanId(leet(qwerty)), label: fam.h + " " + given.h };
}

// 전략 3: 영어단어 + 이름 조각 + 날짜
// happy._.jini9844  lucky_soyeon.02  baby_._park98
function stratEngNick(fam, given) {
  const eng = rand(ENG_WORDS);
  const num = birthNum();
  const nick = rand([
    given.s[given.s.length - 1],        // 마지막 음절
    given.s[0],                          // 첫 음절
    given.r.slice(0, 4),                 // 이름 앞 4자
    fam.r + given.s[0],                  // 성 + 첫 음절
  ]);
  const sep1 = rand(SEPS_CUTE);
  const sep2 = rand(SEPS_GENERAL);
  const variants = [
    () => eng + sep1 + nick + num,
    () => eng + sep1 + fam.r + nick + num,
    () => eng + sep2 + nick + num,
    () => fam.r + sep1 + eng + num,
    () => nick + sep1 + eng + num,
    () => eng + nick + num,
  ];
  return { id: cleanId(rand(variants)()), label: fam.h + " " + given.h };
}

  const variants = [
    () => word.r + sep + num,
    () => fam.r + sep + word.r + num,
    () => word.r + sep + hint,
    () => word.r + sep + fam.r,
    () => leet(word.r) + sep + num,
    () => given.s[0] + sep + word.r + num,
    () => word.r + "__" + hint,

  ];
  return { id: cleanId(rand(variants)()), label: fam.h + " " + given.h + " (" + word.h + ")" };

// 전략 9: 랜덤 음절 조합 — 한국어 발음 패턴 기반
// samin97  joribam04  garumin_98  toksal01
function stratRandomSyll(fam, given) {
  const numSylls = randInt(2, 4);
  const sylls = Array.from({length: numSylls}, () => rand(KR_SYLLS));
  // 성씨 이니셜이나 음절을 하나 섞어 연결고리 만들기
  if (prob(0.4)) sylls[0] = rand([fam.r.slice(0,2), fam.i, given.s[0].slice(0,2)]);
  const base = sylls.join(rand(["","_","."]));
  const num = birthNum();
  const variants = [
    () => base + num,
    () => base + "_" + num,
    () => base + "." + fragNum(num),
    () => num + base,
    () => base,
  ];
  return { id: cleanId(leet(rand(variants)())), label: fam.h + " " + given.h + " (랜덤)" };
}

// ════════════════════════════════════════════════════
// 전략 선택기 (최근 2회 제외)
// ════════════════════════════════════════════════════

const STRATEGIES = [
  stratFragmented, stratKeyboard, stratEngNick,
  stratKrWord, stratFrame, stratAesthetic, stratSyllableMix,
  stratNickname, stratRandomSyll,
];
let recentIdx = [];

function pickStrategy() {
  const pool = STRATEGIES.map((_, i) => i).filter(i => !recentIdx.slice(-2).includes(i));
  const idx = rand(pool.length ? pool : STRATEGIES.map((_, i) => i));
  recentIdx.push(idx);
  if (recentIdx.length > 5) recentIdx.shift();
  return STRATEGIES[idx];
}

// ════════════════════════════════════════════════════
// 중복 방지 + 생성기
// ════════════════════════════════════════════════════

const STORAGE_KEY = "kr_ig_ids_v3";

function loadHistory() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); }
  catch { return []; }
}

function saveHistory(h) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(h));
}

function generateOne(usedSet) {
  const MAX = 100;
  for (let i = 0; i < MAX; i++) {
    const fam   = rand(FAMILY_NAMES);
    const given = rand(GIVEN_NAMES);
    const stratFn = pickStrategy();
    let result;
    try { result = stratFn(fam, given); }
    catch { continue; }
    const { id, label } = result;
    if (id && isValidId(id) && !usedSet.has(id)) {
      usedSet.add(id);
      return { id, label, ts: Date.now() };
    }
  }
  return null; // 100회 실패 시 skip
}

// ════════════════════════════════════════════════════
// UI
// ════════════════════════════════════════════════════

let currentBatch = [];

function generateBatch() {
  const count = Math.min(parseInt(document.getElementById("count").value) || 30, 500);
  const history = loadHistory();
  const usedSet = new Set(history.map(e => e.id));

  const batch = [];
  for (let i = 0; i < count; i++) {
    const entry = generateOne(usedSet);
    if (entry) batch.push(entry);
  }

  history.push(...batch);
  saveHistory(history);
  currentBatch = batch;

  renderList(batch);
  document.getElementById("result-info").textContent =
    `${batch.length}개 생성됨` + (batch.length < count ? ` (${count - batch.length}개 실패)` : "");
  document.getElementById("history-info").textContent = `전체 기록: ${history.length}개`;
}

function renderList(batch) {
  const el = document.getElementById("output");
  if (!batch.length) {
    el.innerHTML = '<div class="empty">생성된 아이디가 없습니다.</div>';
    return;
  }
  el.innerHTML = batch.map((e, i) =>
    `<div class="id-row">
      <span class="id-val">${e.id}</span>
      <span class="id-name">${e.label}</span>
      <button class="copy-btn" onclick="copyOne('${e.id}', this)">복사</button>
    </div>`
  ).join("");
}

function copyOne(id, btn) {
  navigator.clipboard.writeText(id).then(() => {
    btn.textContent = "✓";
    btn.classList.add("done");
    setTimeout(() => { btn.textContent = "복사"; btn.classList.remove("done"); }, 1300);
  });
}

function copyAll(btn) {
  if (!currentBatch.length) return;
  const text = currentBatch.map(e => `${e.id}\t${e.label}`).join("\n");
  navigator.clipboard.writeText(text).then(() => {
    const orig = btn.textContent;
    btn.textContent = "복사됨!";
    setTimeout(() => btn.textContent = orig, 1500);
  });
}

function exportCSV() {
  const history = loadHistory();
  if (!history.length) { alert("내보낼 기록이 없습니다."); return; }
  const rows = ["\uFEFFID,이름,생성시각"];
  history.forEach(e =>
    rows.push(`${e.id},"${e.label}",${new Date(e.ts || Date.now()).toLocaleString("ko-KR")}`)
  );
  const blob = new Blob([rows.join("\n")], { type: "text/csv;charset=utf-8" });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  a.href = url; a.download = "korean_ig_ids.csv"; a.click();
  URL.revokeObjectURL(url);
}

function clearHistory() {
  if (!confirm("모든 생성 기록을 삭제할까요?\n삭제 후엔 기존 아이디가 다시 생성될 수 있습니다.")) return;
  localStorage.removeItem(STORAGE_KEY);
  currentBatch = [];
  renderList([]);
  document.getElementById("result-info").textContent = "아직 생성된 아이디가 없습니다";
  document.getElementById("history-info").textContent = "";
}

// 초기 기록 수 표시
(function() {
  const h = loadHistory();
  if (h.length) document.getElementById("history-info").textContent = `전체 기록: ${h.length}개`;
})();
</script>
